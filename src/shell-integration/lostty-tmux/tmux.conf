# Lostty's private tmux server (tmux -L lostty). Lostty owns this file; the
# user's ~/.tmux.conf is never read. A pane here should feel like a plain
# Lostty pane, while its session outlives the window and can be attached
# from the phone. Read when the server starts (the first Lostty pane).

# No tmux UI: no status bar, no prefix key (nothing steals Ctrl-B).
set -g status off
set -g prefix None
unbind-key C-b

# Shell signals, titles and the clipboard reach every attached client.
set -g allow-passthrough on
set -s set-clipboard on
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Size follows whichever client was used last (Mac window or phone).
set -g window-size latest

# Keys and colors as the outer terminal sends them: Esc without delay,
# Shift+Enter and friends for Claude Code, truecolor, focus, hyperlinks.
set -s escape-time 0
set -s extended-keys on
set -s extended-keys-format csi-u
set -s focus-events on
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB:extkeys:clipboard:title:focus:strikethrough:usstyle:overline:sync:hyperlinks'

# Mouse: the wheel scrolls back through history (leaving at the bottom);
# a drag selects, copies to the clipboard and leaves copy mode, so typing
# goes straight back to the shell. Shift+drag still makes a Lostty selection.
set -g mouse on
set -g history-limit 100000
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# The wheel scrolls a line per event, as a plain pane does (tmux's default
# is 5, which jumps on a trackpad), and copy mode shows no position
# indicator in the corner.
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X scroll-down
set -g copy-mode-position-format ''

# Keep only the root mouse bindings a plain pane needs (click, drag-select,
# word/line select, wheel up). The rest are tmux UI: pane/window menus,
# border resize, new-pane drags. A second tmux pane would break the
# one-shell-per-session model.
unbind-key -T root MouseDown1Status
unbind-key -T root MouseDown1Border
unbind-key -T root MouseDown1ScrollbarUp
unbind-key -T root MouseDown1ScrollbarDown
unbind-key -T root MouseDown1Control7
unbind-key -T root MouseDown1Control8
unbind-key -T root MouseDown1Control9
unbind-key -T root MouseDown2Pane
unbind-key -T root MouseDown3Pane
unbind-key -T root MouseDown3Status
unbind-key -T root MouseDown3StatusLeft
unbind-key -T root MouseDown3Empty
unbind-key -T root MouseDrag1Border
unbind-key -T root MouseDrag1ScrollbarSlider
unbind-key -T root WheelDownStatus
unbind-key -T root WheelUpStatus
unbind-key -T root M-MouseDown3Pane
unbind-key -T root M-MouseDown3Status
unbind-key -T root M-MouseDown3StatusLeft
unbind-key -T root M-MouseDown3Empty
unbind-key -T root M-MouseDrag1Pane
unbind-key -T root M-MouseDrag1Border
unbind-key -T root C-MouseDown1Status
unbind-key -T root C-MouseDrag1Pane
unbind-key -T root C-MouseDrag1Empty

# Each session gets its pane's variables (new-session -e); the ones left
# over from whichever pane started the server must not leak into others.
set-environment -gu LOSTTY_SURFACE
set-environment -gu LOSTTY_SKINS_SURFACE
set-environment -gu GHOSTTY_SKINS_SURFACE
set-environment -gu LOSTTY_APP_PID
set-environment -gu LOSTTY_TMUX
set-environment -gu ZDOTDIR

# Lostty Mobile: one wait-for channel says "sessions changed" to the phone's
# list and the Mac's watcher. The Mac app sets these again for a server
# started without them.
set-hook -g session-created 'wait-for -S lostty-changed'
set-hook -g session-closed 'wait-for -S lostty-changed'
set-hook -g session-renamed 'wait-for -S lostty-changed'
set-hook -g client-attached 'wait-for -S lostty-changed'
set-hook -g client-detached 'wait-for -S lostty-changed'
# Keep the server up when the last session ends: it holds @lostty_end_<n>,
# the reason the phone reads after the session is gone. The next Lostty to
# launch stops a server left with no sessions.
set -s exit-empty off
