# Copy to ~/.config/ghostty-skins/skins.toml. Saved changes apply immediately.

[defaults]
texture_opacity = 0.16   # 0–1; how visible textures are
auto = true              # automatic skin for any git repo not listed below

[skins.arca]
background = "#12222b"
foreground = "#eaf3ff"
accent     = "#46a2ff"   # logo color
logo       = "~/projectrepos/arca-labs/website/assets/favicon.svg"

[skins.prod]             # not tied to a folder; use with `skins set prod`
background = "#3a0f14"
texture    = "diagonal"  # dots, grid, diagonal, cross, waves, noise, scanlines, sparkle,
                         # rings, lightning, tide, blades, petals, starfield, tempest, none

[[match]]
path = "~/projectrepos/arca"
skin = "arca"

[[match]]
path = "~/projectrepos/arca-labs"
skin = "arca"

# Claude trace (shown while Claude Code works in a pane). Optional per skin:
# trace = "bolt"           # or beam, comet, sunset, datastream, sonar, ember,
#                          # bubbles, tide, blade, petal, arrow, tempest, none
# trace_color = "#ffd84a"
# trace_color2 = "#7fc8ff"
# trace_speed = 1.0        # 0.25–4
# trace_length = 0.18      # 0.05–0.5
# Turn traces off everywhere with `trace = false` under [defaults].
